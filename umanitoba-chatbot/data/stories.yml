version: "3.1"

stories:
  - story: greet and ask university question
    steps:
      - intent: greet
      - action: utter_greet
      - intent: ask_university_question
      - action: action_check_university_relevance
      - action: action_answer_university_question

  - story: direct university question
    steps:
      - intent: ask_university_question
      - action: action_check_university_relevance
      - action: action_answer_university_question

  - story: multiple university questions
    steps:
      - intent: ask_university_question
      - action: action_check_university_relevance
      - action: action_answer_university_question
      - intent: ask_university_question
      - action: action_check_university_relevance
      - action: action_answer_university_question

  - story: out of scope question
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope

  - story: greet and goodbye
    steps:
      - intent: greet
      - action: utter_greet
      - intent: goodbye
      - action: utter_goodbye

  - story: question then goodbye
    steps:
      - intent: ask_university_question
      - action: action_check_university_relevance
      - action: action_answer_university_question
      - intent: goodbye
      - action: utter_goodbye
